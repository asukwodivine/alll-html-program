<!Doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            body {
                background-color: #c4cce7;
                font-family: 'Outfit', sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
            }
            .qr-box {
                background-color:#ffffff;
                padding: 20px;
                margin-top: 10px;
                border-radius: 20px ;
                border-width:20px;
                box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
                text-align: center;
                width: 320px;

             }

    
                .qr-image {
                    width: 100%;
                    height: auto;
                    border-radius: 12px;
                    display: block;
                

            }
            h3{
                color: #212742;
                font-size: 15px;
                margin-bottom: 10px;
                font-weight: bold;
                font-family: 'Arial Black', Arial, sans-serif;
            }
            p{
                color: #4e4d4d;
                font-size: 14px;
                line-height: 1.4;
            }
        </style>
    </head>
    <body>
        <div class="qr-box">
            <img src="image/image-qr-code.png" alt="QR code" class="qr-image">
            <h3>improve your front-end skills by building projects</h3>
            <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
            </div>
    </body> 
</html>
